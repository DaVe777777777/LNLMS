<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html>
<head>
    <script src="assets/Content/js/jQuery-2.1.4.min.js" type="text/javascript"></script>
    <script type="text/javascript" src="assets/javascripts/draw-canvas.js"></script>	
    <link href="http://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,400,600,700,300&subset=latin" rel="stylesheet" type="text/css">
    <style>
        * {
            font-family:'Berlin Sans FB';
        }
    </style>

    <script type="text/javascript">

        //Save as Image file
        var getQueryString = function (field, url) {
            var href = url ? url : window.location.href;
            var reg = new RegExp('[?&]' + field + '=([^&#]*)', 'i');
            var string = reg.exec(href);
            return string ? string[1] : null;
        };


        function LMSSaveImage() {
            console.log("hit!");
            var m = confirm("Are you sure to Save ");
            if (m) {
                console.log("saving ... ");
                // generate the image data
                var trans_Id = getQueryString('transId');
                var image_NEW = document.getElementById("myCanvas").toDataURL("image/png");
                image_NEW = image_NEW.replace('data:image/png;base64,', '');
                console.log(image_NEW);
                $.ajax({
                    type: 'POST',
                    url: 'SaveCanvasImage.aspx/UploadPic',
                    data: '{ "imageData" : "' + image_NEW + '","trans_Id" : "' + trans_Id + '" }',
                    contentType: 'application/json; charset=utf-8',
                    dataType: 'json',
                    success: function (msg) {
                        alert('successfully saved images!');
                    },
                    error: function (msg) {
                        alert(msg);
                    }
                });
            }
        }

    </script>
</head>
<body onload="InitThis();">
    <div align="center">
        <canvas id="myCanvas" width="500" height="230" style="border:1px solid black"></canvas>
        <br /><br />
        <button onclick="javascript:clearArea();return false;">Clear All</button>
        Line width : <select id="selWidth">
            <option value="1" selected="selected">1</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="9">9</option>
            <option value="11">11</option>
        </select> 
        Color : <select id="selColor">
            <option value="black" selected="selected">black</option>
            <option value="white">white</option>
            <option value="blue">blue</option>
            <option value="red">red</option>
            <option value="green">green</option>
            <option value="yellow">yellow</option>
            <option value="gray">gray</option>
        </select> 
        <button id="SavePictorial" onclick="LMSSaveImage();">Save</button>
    </div>
</body>
</html>
